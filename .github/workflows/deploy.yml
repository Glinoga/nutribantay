name: Deploy to KVM 2 VPS

on:
  push:
    branches: [merged]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Validate composer
        run: composer validate --strict

      - name: Install PHP deps (no dev)
        run: composer install --no-dev --optimize-autoloader

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build frontend
        run: |
          npm ci
          npm run build:ssr

      - name: Deploy to VPS via rsync
        uses: easingthemes/ssh-deploy@v6.0.3
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          ARGS: '-rlgoDzvc --timeout=30 --delete --exclude-from=.deployignore'
          SOURCE: '.'
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
          TARGET: ${{ secrets.VPS_DEPLOY_PATH }}

      - name: Post-deploy (migrate, cache, restart queue)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            php artisan migrate --force
            php artisan db:seed --class=VitaminSeeder --force
            php artisan dashboard:refresh
            php artisan config:cache
            php artisan view:cache
            php artisan queue:restart
            test -L public/storage || ln -s storage/app/public public/storage
            php artisan app:setup-backup-folders || true
            # Run due scheduled tasks once during deploy
            php artisan schedule:run --no-interaction 2>&1 | tee -a storage/logs/scheduler.log || true
            # Persistent cron job — runs every minute, logs errors for debugging
            PHP_BIN=$(command -v php)
            SCHED_LOG='${{ secrets.VPS_DEPLOY_PATH }}/storage/logs/scheduler.log'
            (crontab -l 2>/dev/null | grep -v "artisan schedule:run"; echo "* * * * * cd '${{ secrets.VPS_DEPLOY_PATH }}' && $PHP_BIN artisan schedule:run --no-interaction >> \"$SCHED_LOG\" 2>&1") | crontab -
            sudo supervisorctl reread
            sudo supervisorctl update
            sudo supervisorctl start all

