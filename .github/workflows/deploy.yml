name: Deploy to KVM 2 VPS

on:
  push:
    branches: [merged]

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Validate composer
        run: composer validate --strict

      - name: Install PHP deps (no dev)
        run: composer install --no-dev --optimize-autoloader

      - name: Build frontend
        run: |
          npm ci
          npm run build:ssr

      - name: Deploy to target directory
        run: |
          sudo rsync -rlgoDzvc --delete --exclude-from=.deployignore . ${{ secrets.VPS_DEPLOY_PATH }}

      - name: Post-deploy (migrate, cache, restart queue)
        run: |
          cd ${{ secrets.VPS_DEPLOY_PATH }}
          php artisan migrate --force
          php artisan db:seed --class=VitaminSeeder --force
          php artisan dashboard:refresh
          php artisan config:cache
          php artisan view:cache
          php artisan queue:restart
          test -L public/storage || ln -s storage/app/public public/storage
          php artisan app:setup-backup-folders || true
          php artisan schedule:run --no-interaction 2>&1 | tee -a storage/logs/scheduler.log || true
          PHP_BIN=$(command -v php)
          SCHED_LOG='${{ secrets.VPS_DEPLOY_PATH }}/storage/logs/scheduler.log'
          (crontab -l 2>/dev/null | grep -v "artisan schedule:run"; echo "* * * * * cd '${{ secrets.VPS_DEPLOY_PATH }}' && $PHP_BIN artisan schedule:run --no-interaction >> \"$SCHED_LOG\" 2>&1") | crontab -
          sudo rm -f /etc/supervisor/conf.d/nutribantay-ssr.conf
          sudo supervisorctl reread
          sudo supervisorctl update
          sudo supervisorctl restart all
